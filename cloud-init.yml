#cloud-config
runcmd:
  - echo "Installing Terraform"
  - apt-get update
  - apt-get install -y unzip curl
  - curl -O https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip
  - unzip terraform_1.10.5_linux_amd64.zip
  - mv terraform /usr/local/bin/
  - rm terraform_1.10.5_linux_amd64.zip

  #install ansible and git and download the scripts and playbook
  - echo "Installing Ansible"
  - apt-get install -y ansible git
    
  #install the azure cli
  - echo "Installing Azure CLI"
  - sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
  - curl -sL https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
  - AZ_REPO=$(lsb_release -cs)
  - echo "deb [arch=amd64] https://packages.microsoft.com/repos/azure-cli/ $AZ_REPO main" | sudo tee /etc/apt/sources.list.d/azure-cli.list
  - sudo apt-get update
  - sudo apt-get install -y azure-cli
  
  - echo "Installing Jenkins"
  - sudo apt update -y
  - sudo apt install openjdk-17-jdk -y
  - sudo curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key | sudo tee /usr/share/keyrings/jenkins-keyring.asc > /dev/null
  - sudo echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" | sudo tee /etc/apt/sources.list.d/jenkins.list > /dev/null
  - sudo apt update -y
  - sudo apt install jenkins -y
  - sudo systemctl start jenkins
  - sudo systemctl enable jenkins

  - sudo apt-get install jq -y
  - git clone https://github.com/mikagouzee/ehealth-iac /home/azureuser/ehealth-iac
  - git clone https://github.com/mikagouzee/control-plane
  - mv ./controlplane/scripts/subscription_feed.sh subscription.sh